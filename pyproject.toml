# NOT PUBLISHED TO PYPI - this repository is an agent skill pack, not a
# distributable Python package. There is no importable module under src/:
# the deliverable is the markdown skill definitions under skill/, which are
# consumed from the repo or the skill marketplace, never via pip install.
# Publishing it would permanently occupy a dcc-mcp namespace slot on PyPI
# while shipping an empty metadata-only wheel. Tracked in PIP-3630.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcc-pipeline-publish"
version = "0.2.0"
description = "Portable release and publish skills for DCC-MCP production workflows"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.optional-dependencies]
# dcc-mcp-core is pinned: the recipe tests assert the pack is loadable by the
# real core recipe runtime (load_recipe_pack / list_recipe_entries), so an
# unpinned core could change that contract under CI. Bump deliberately.
test = ["pytest>=8", "jsonschema>=4.18", "PyYAML>=6", "dcc-mcp-core>=0.20.11,<0.21.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

